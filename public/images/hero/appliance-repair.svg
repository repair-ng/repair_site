<svg viewBox="0 0 800 450" xmlns="http://www.w3.org/2000/svg">
  <rect width="800" height="450" fill="#12203A"/>
  <circle cx="120" cy="100" r="160" fill="#1B2637"/>
  <circle cx="700" cy="360" r="180" fill="#1B2637"/>
  <rect x="0" y="360" width="800" height="90" fill="#0C1220"/>

  <!-- washing machine body -->
  <rect x="280" y="90" width="240" height="270" rx="16" fill="#F7F5F0"/>
  <rect x="280" y="90" width="240" height="46" rx="16" fill="#E4DFD4"/>
  <circle cx="310" cy="113" r="7" fill="#0FA3A3"/>
  <circle cx="335" cy="113" r="7" fill="#F4650B"/>

  <!-- drum -->
  <circle cx="400" cy="255" r="88" fill="#101826"/>
  <circle cx="400" cy="255" r="70" fill="none" stroke="#0FA3A3" stroke-width="6"/>
  <circle cx="400" cy="255" r="46" fill="none" stroke="#0FA3A3" stroke-width="3" opacity="0.6"/>

  <!-- wrench crossing drum -->
  <g transform="rotate(35 400 255)">
    <rect x="392" y="180" width="18" height="150" rx="8" fill="#F4650B"/>
    <circle cx="401" cy="170" r="28" fill="none" stroke="#F4650B" stroke-width="16"/>
  </g>

  <!-- toolbox -->
  <g transform="translate(560,300)">
    <rect x="0" y="20" width="120" height="60" rx="8" fill="#F4650B"/>
    <rect x="0" y="20" width="120" height="14" fill="#D6540A"/>
    <path d="M35 20 v-22 a10 10 0 0 1 10 -10 h10 a10 10 0 0 1 10 10 v22" fill="none" stroke="#D6540A" stroke-width="10"/>
  </g>

  <!-- floating spanner -->
  <g transform="translate(160,260) rotate(-20)" fill="none" stroke="#E4DFD4" stroke-width="10" stroke-linecap="round">
    <line x1="0" y1="0" x2="60" y2="0"/>
    <circle cx="-10" cy="0" r="16"/>
  </g>
</svg>
