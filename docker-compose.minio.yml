# MinIO for Dokploy (create as a "Compose" service, paste this file, then add Domains in the Domains tab):
#   api.<your-domain>      -> service "minio", container port 9000
#   console.<your-domain>  -> service "minio", container port 9001
# Set MINIO_ROOT_USER / MINIO_ROOT_PASSWORD in the Compose "Environment" tab.
services:
  minio:
    image: minio/minio:latest        # pin to a dated RELEASE.* tag in production
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      MINIO_SERVER_URL: https://${MINIO_API_DOMAIN}
      MINIO_BROWSER_REDIRECT_URL: https://${MINIO_CONSOLE_DOMAIN}
    volumes:
      - minio-data:/data
    expose: ["9000", "9001"]          # NOT "ports": nothing is published on the host; Traefik routes via the Domains tab
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 30s
      timeout: 5s
      retries: 5
    networks:
      default: {}
      dokploy-network:
        aliases: [repair-minio]       # stable private DNS name for the web app: http://repair-minio:9000
volumes:
  minio-data:
networks:
  dokploy-network:
    external: true
